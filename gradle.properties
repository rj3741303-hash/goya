org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Version of cz.adaptech.tesseract4android used by app/build.gradle.kts.
#
# 4.9.0 is the current release of the library (Tesseract OCR 5.5.1, Leptonica 1.85.0).
# It is served from JitPack, which settings.gradle.kts adds as a repository - the library
# is not on Maven Central for current versions.
#
# The CI workflow tries to resolve a newer version from JitPack/Maven Central metadata and
# overrides this with -PtesseractVersion=<version> when it succeeds, so the build log always
# records the exact version used. If metadata is unreachable, this pinned value is used.
#
# List published versions with:
#     bash tools/list-tesseract-versions.sh
tesseractVersion=4.9.0
